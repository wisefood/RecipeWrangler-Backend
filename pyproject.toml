[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-wrangler"
version = "0.0.0"
description = "RecipeWrangler backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-huggingface>=0.3.0,<0.4.0",
    "langchain-groq==0.3.8",
    "langgraph>=1.0.0",
    "neo4j>=5.20.0",
    "neo4j-graphrag>=1.6.0,<1.8.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "groq>=0.4.1,<1.0.0",
    "sentencepiece>=0.2.1",
    "sentence-transformers>=5.2.2",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pynutriscore>=0.0.2",
    "bs4>=0.0.2",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    # Must track the deployed server's major version: a 9.x client sends
    # `compatible-with=9`, which an 8.x server rejects with
    # media_type_header_exception on every request, including info(). The
    # cluster runs 8.14.3 and elasticsearch-docker pins 8.15.0. Nothing in the
    # repo imports this today — ES access goes through utils/http_pool — but
    # the pin must not lie about what the cluster can accept.
    "elasticsearch>=8.14,<9",
    "openai>=2.30.0",
    "langchain-openai>=0.3.35",
    "redis==6.4.0",
]

[project.optional-dependencies]
dev-tools = [
    "ipykernel>=7.1.0",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
]
experimental = [
    "langchain-ollama>=0.1.0,<0.4.0",
    "langserve>=0.1.0",
    "ollama>=0.3.0",
    "qdrant-client>=1.7.0",
]
pricing = [
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"recipe_wrangler.pricing" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
